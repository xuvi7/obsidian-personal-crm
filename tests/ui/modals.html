<!doctype html>

<title>PRM modals harness</title>
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --background-primary: #1e1e1e; --background-secondary: #252525;
    --background-modifier-border: #3a3a3a; --background-modifier-hover: #2c2c2c;
    --background-modifier-active-hover: #333;
    --text-normal: #dcddde; --text-muted: #999; --text-faint: #666;
    --text-accent: #7f6df2; --text-error: #e5534b; --text-warning: #d29922;
    --text-success: #3fb950; --text-on-accent: #fff;
    --interactive-accent: #7f6df2; --interactive-accent-hover: #8f7ff5;
    --radius-s: 4px; --radius-m: 8px;
    --font-ui-small: 13px; --font-ui-smaller: 12px;
    --font-monospace: ui-monospace, monospace; --icon-s: 16px;
  }
  html,body{margin:0;background:#0d0d0d;color:var(--text-normal);
    font-family:-apple-system,system-ui,sans-serif;font-size:14px;padding:24px;}
  #modal-host{display:flex;flex-direction:column;align-items:center;gap:28px;}
  .modal{background:var(--background-primary);border:1px solid #444;border-radius:10px;
    padding:20px 24px;box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .modal-title{font-size:1.15rem;font-weight:700;margin-bottom:10px;}
  .setting-item{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:10px 0;border-top:1px solid var(--background-modifier-border);}
  .setting-item-name{font-weight:600;}
  .setting-item-description{color:var(--text-muted);font-size:var(--font-ui-smaller);}
  .setting-item-control{display:flex;gap:8px;align-items:center;}
  button{background:#2f2f2f;color:var(--text-normal);border:none;border-radius:var(--radius-s);
    padding:6px 12px;font-size:13px;cursor:pointer;}
  button.mod-cta{background:var(--interactive-accent);color:#fff;font-weight:600;}
  button.mod-warning{background:var(--text-error);color:#fff;}
  input,select,textarea{background:#2a2a2a;color:var(--text-normal);
    border:1px solid #3a3a3a;border-radius:var(--radius-s);padding:5px 8px;font-size:13px;}
  .svg-icon{width:16px;height:16px;vertical-align:middle;}
  h2{font-size:1.2rem;margin:0;}
  .caption{color:#777;font-size:12px;text-align:center;margin-bottom:-16px;}
</style>
<div id="modal-host"></div>
<script>
function applyOpts(el,o){ if(!o) return el;
  if(typeof o==="string"){el.className=o;return el;}
  if(o.cls)(Array.isArray(o.cls)?o.cls:String(o.cls).split(" ")).forEach(c=>c&&el.classList.add(c));
  if(o.text!=null)el.textContent=o.text;
  if(o.attr)for(const[k,v]of Object.entries(o.attr))el.setAttribute(k,v);
  return el; }
HTMLElement.prototype.createEl=function(t,o){const e=document.createElement(t);applyOpts(e,o);this.appendChild(e);return e;};
HTMLElement.prototype.createDiv=function(o){return this.createEl("div",o);};
HTMLElement.prototype.createSpan=function(o){return this.createEl("span",o);};
HTMLElement.prototype.empty=function(){while(this.firstChild)this.removeChild(this.firstChild);};
HTMLElement.prototype.addClass=function(c){this.classList.add(c);return this;};
HTMLElement.prototype.addClasses=function(cs){cs.forEach(c=>this.classList.add(c));return this;};
HTMLElement.prototype.removeClass=function(c){this.classList.remove(c);return this;};
HTMLElement.prototype.toggleClass=function(c,o){this.classList.toggle(c,!!o);return this;};
HTMLElement.prototype.setText=function(t){this.textContent=t;};
HTMLElement.prototype.isShown=function(){return true;};
String.prototype.contains=function(s){return this.indexOf(s)!==-1;};
window.createFragment=(fn)=>{const f=document.createDocumentFragment();
  f.createDiv=(o)=>{const d=document.createElement("div");applyOpts(d,o);f.appendChild(d);return d;};
  f.createEl=(t,o)=>{const d=document.createElement(t);applyOpts(d,o);f.appendChild(d);return d;};
  f.appendText=(t)=>f.appendChild(document.createTextNode(t));fn(f);return f;};
</script>
<script>
// Obsidian exposes these; the harness must too, or the real code can't run.
window.activeDocument = document;
</script>
<script>
  /* Real Obsidian puts .is-mobile / .is-phone / .is-tablet on the body and keys its
     own CSS off them; this plugin does too. Without these the mobile rules never
     fire and the harness would report the desktop layout as if it were the phone.
     Drive it with ?device=phone, ?device=tablet, or omit for desktop. */
  (function () {
    var d = new URLSearchParams(location.search).get("device");
    var b = document.body;
    if (d === "phone") b.classList.add("is-mobile", "is-phone");
    else if (d === "tablet") b.classList.add("is-mobile", "is-tablet");
    b.dataset.device = d || "desktop";
  })();
</script>
