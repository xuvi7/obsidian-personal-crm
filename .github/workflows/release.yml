name: Release

# Builds the plugin from source on a version tag and attaches signed artifacts.
# Building in CI rather than uploading a local build is what makes the
# attestation meaningful: it proves the assets came from this commit.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to"
        required: true

permissions:
  contents: write      # create/update the release and upload assets
  id-token: write      # required to mint the attestation
  attestations: write  # required to record it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Verify the tag matches manifest.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag '$TAG' does not match manifest version '$MANIFEST'." >&2
            echo "Obsidian looks releases up by the exact version string, so these must agree." >&2
            exit 1
          fi
          node -e "
            const v = require('./versions.json'), m = require('./manifest.json');
            if (v[m.version] !== m.minAppVersion) {
              console.error('versions.json disagrees with manifest minAppVersion');
              process.exit(1);
            }
          "

      - name: Extract this version's release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Fails the build if the version has no changelog entry, which is
          # deliberate: a release without notes isn't ready.
          node scripts/changelog-section.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
          wc -c < "$RUNNER_TEMP/release-notes.md"

      - run: npm run typecheck
      - run: npm run lint

      - name: Build
        run: |
          PRM_OUT_DIR="$PWD/dist" node esbuild.config.mjs production
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/main.js
            dist/styles.css
            dist/manifest.json

      - name: Publish the release and attach assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Set the notes on re-runs too, not only on first creation.
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" \
            dist/main.js dist/manifest.json dist/styles.css --clobber
